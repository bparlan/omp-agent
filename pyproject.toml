[project]
name = "omp-cli"
version = "0.1.0"
description = "OMP CLI dispatcher"
authors = [
  { name="Gemini", email="gemini@example.com" },
]
requires-python = ">=3.9"
dependencies = [
  "click",
  "PyYAML",
  "regex", # Used by validate_metadata.py
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omp_cli"]
